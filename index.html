<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ClickAbutton - Pro</title>
    <style>
        body { text-align: center; font-family: sans-serif; transition: background 0.3s; padding: 20px; }
        #spielBereich { display: none; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 10px; border: none; margin: 10px; background-color: #ffcc00; }
        .box { background: white; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.2); }
        iframe { width: 100%; max-width: 500px; height: 300px; border: none; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="box" id="loginBereich">
        <h1>ClickAbutton</h1>
        <p>Ein Spiel von Thaer Hasan Faisal Almusawi</p>
        <input type="text" id="username" placeholder="Dein Name">
        <br>
        <button onclick="starteSpiel()">Spiel starten</button>
    </div>

    <div id="spielBereich">
        <div class="box">
            <h1 id="begruessung"></h1>
            <button id="clickMe">Klick mich!</button>
            <h2>Punkte: <span id="score">0</span></h2>
        </div>

        <br>
        <div class="box">
            <h2>Bestenliste</h2>
            <iframe src="
GET
Method
https://api.sheetbest.com/sheets/b9812567-f893-45cd-a9bb-d76ce626a6b0"></iframe>
        </div>
    </div>

    <script>
        let punkte = 0;
        function starteSpiel() {
            let name = document.getElementById("username").value;
            if (name === "") { alert("Name eingeben, Bre!"); return; }
            document.getElementById("loginBereich").style.display = "none";
            document.getElementById("spielBereich").style.display = "block";
            document.getElementById("begruessung").innerText = "Leg los, " + name + "!";
        }
        document.getElementById("clickMe").addEventListener("click", () => {
            punkte++;
            document.getElementById("score").innerText = punkte;
            document.body.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);
        });
    </script>
</body>
</html>
